# Sift policy. Copy to ~/.codex-sift/policy.yaml to override.
# Jev returns signals. These rules pick a lane. First match wins.

jev_model: jev-1.13.0
jev_timeout_ms: 2500
min_confidence: 0.55
on_jev_down: craft

virtual_model:
  slug: sift
  display_name: Sift
  description: Cheapest Codex model that can handle this turn, judged by Jev.

lanes:
  flash:
    model: gpt-5.6-luna
    effort: low
  craft:
    model: gpt-5.6-terra
    effort: medium
  forge:
    model: gpt-5.6-sol
    effort: high

prices_usd_per_1m:
  gpt-5.6-luna: 0.4
  gpt-5.6-terra: 1.2
  gpt-5.6-sol: 3.6
  gpt-6-astra: 6.0

rules:
  - when: "confidence < 0.55"
    lane: forge
    reason: Jev was unsure, escalate
  - when: "high_stakes > 0.7"
    lane: forge
    reason: high-stakes surface
  - when: "difficulty >= 2.2"
    lane: forge
    reason: hard or novel work
  - when: "needs_planning > 0.7 and cross_cutting > 0.6"
    lane: forge
    reason: cross-cutting design
  - when: "needs_reasoning > 0.6 and difficulty >= 1.3"
    lane: craft
    reason: needs real diagnosis
  - when: "task_kind in [ask, ops] and difficulty < 1.2"
    lane: flash
    reason: lookup or plumbing
  - when: "task_kind == edit and difficulty < 1.3 and high_stakes < 0.4"
    lane: flash
    reason: localized cheap edit
  - when: "difficulty < 1.5"
    lane: craft
    reason: everyday implementation
  - when: "true"
    lane: craft
    reason: default balanced lane
