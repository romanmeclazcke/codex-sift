name: Discovery metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "19 13 * * 1"

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record downloads and search positions
        run: |
          set -o pipefail
          node tools/discovery.mjs | tee "$GITHUB_STEP_SUMMARY" discovery.md
      - uses: actions/upload-artifact@v4
        with:
          name: discovery
          path: discovery.md
